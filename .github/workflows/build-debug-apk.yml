name: Build Dhaka Metro 3D v10 Offline Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Arrange flat files & bundle Three.js for 100% Offline APK
        run: |
          mkdir -p android/app/src/main/java/com/dhakametro/game
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets/www/css
          mkdir -p android/app/src/main/assets/www/js/models
          mkdir -p android/app/src/main/assets/www/js/systems

          cp gradle.properties android/gradle.properties
          cp root-build.gradle android/build.gradle
          cp settings.gradle android/settings.gradle
          cp app-build.gradle android/app/build.gradle
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp styles.xml android/app/src/main/res/values/styles.xml
          cp MainActivity.java android/app/src/main/java/com/dhakametro/game/MainActivity.java

          cp manifest.json icon.svg sw.js index.html android/app/src/main/assets/www/
          cp style.css android/app/src/main/assets/www/css/
          cp config.js audio.js main.js android/app/src/main/assets/www/js/
          cp trainModel.js characterModel.js stationModel.js cityModel.js android/app/src/main/assets/www/js/models/
          cp announcementSystem.js weatherSystem.js missionSystem.js android/app/src/main/assets/www/js/systems/

          # Download Three.js locally so the APK runs 100% offline!
          curl -L -o android/app/src/main/assets/www/js/three.module.js https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhaka-metro-3d-v10-offline-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
